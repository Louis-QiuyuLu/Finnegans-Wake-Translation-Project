name: Deploy reader to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs
      - run: python3 scripts/project.py check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/project.py build
      - name: Verify generated manuscript views
        run: |
          generated_changes="$(git status --porcelain --untracked-files=all -- raw-md translated-md polish annotations publish/PROGRESS.md progress/RESUME.md progress/chapters)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        id: deployment
