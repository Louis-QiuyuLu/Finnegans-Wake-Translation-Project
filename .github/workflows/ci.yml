name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs
      - run: python3 scripts/project.py check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/project.py build
      - name: Verify generated manuscript views
        run: |
          generated_changes="$(git status --porcelain --untracked-files=all -- raw-md translated-md polish annotations publish/PROGRESS.md progress/RESUME.md progress/chapters)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: finnegans-wake-reader
          path: dist/
          retention-days: 30
